<!DOCTYPE html>
<html lang="en">
<head>

<title>My Playlist</title>
<style>

    background-color: rgb(204, 204, 204);
    font-family: Arial, Helvetica, sans-serif;

  h1 {
    text-align: center;
  }

  h2 {
    text-align: center;
  }

  ul li {

    border-radius: 10px;

</head>
<body>
